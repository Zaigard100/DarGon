# Мастерская механика (русский).
level.01.t1 = Мастерская механика.\nКаждая комната здесь —\nодин механизм.
level.01.t2 = Сундук открывается\nс соседней клетки.\nЛампы мигают сами —\nэто скрипт уровня.
level.01.name = Мастерская
level.02.t1 = Ключ открывает дверь\nи сундук своего цвета.
level.02.name = Ключи и замки
level.03.t1 = Кнопка нажимается снова,\nтолько если сойти\nс неё и вернуться.
level.03.name = Кнопки
level.04.t1 = Жёлтая плита\nстроит мост.
level.04.name = Нажимные плиты
level.05.t1 = Кнопка открывает решётку\nна девять секунд.\nЛампы считают время.
level.05.name = Часовой механизм
level.06.t1 = Стражи ходят по рядам.\nПереждите в середине:\nтам лечит.
level.06.name = Патруль
level.07.t1 = Огнём дирижирует скрипт.\nЗелёная лампа —\nстолб погас.
level.07.name = Огненный ритм
level.08.t1 = Темно. Иди за светлячком —\nон знает дорогу.\nВ тупиках монеты… и ловушки.
level.08.name = Тьма
level.09.t1 = Лавка принимает монеты.\nА стена справа\nкакая-то тонкая…
level.09.name = Лавка и тайник
level.10.t1 = Проходы меняются\nкаждые полторы секунды.\nНа героя стена не встанет.
level.10.name = Живые стены
level.11.t1 = Мост строится под ногами\nи рушится за спиной.\nНа трещинах не стой.
level.11.name = Мост под ногами
level.12.t1 = Телепорт ведёт туда,\nкакого цвета горит лампа.\nКрасная, синяя, зелёная.
level.12.name = Карусель телепортов
level.13.t1 = Кристалл открывает выход.\nИ клетки тоже.
level.13.name = Камикадзе
level.14.t1 = Рычаг справа\nобесточивает арбалеты.\nХрабрецы идут без него.
level.14.name = Тир
level.15.t1 = «Жизнь» Конвея на стенах.\nКнопки: пуск/пауза, шаг,\nглайдер, случайно.\nЧерез 30 поколений —\nвыход.
level.15.name = Жизнь
level.16.t1 = Запомни, какие лампы\nзагорелись, и наступи\nна плиты в том же порядке.
level.16.name = Саймон
level.17.t1 = Лабиринт строит скрипт —\nкаждый раз новый.\nБыстрее 30 секунд? 
level.17.name = Лабиринт
level.18.t1 = Собери три кристалла.\nЗмей ползёт за тобой\nи растёт с каждым.
level.18.name = Змей
level.19.t1 = Двенадцать мин.\nЧисло — сколько мин\nв соседних клетках.
level.19.name = Сапёр
level.20.t1 = Наступай на горящие плиты:\nтри удара — и сердце\nмеханизма остановится.
level.20.name = Сердце механизма
ach.first_day.name = Первый день
ach.first_day.desc = Пройти первый уровень.
ach.curious.name = Любопытный
ach.curious.desc = Найти тайник за ложной стеной в «Кнопках».
ach.clockwork.name = Как часы
ach.clockwork.desc = Пройти «Часовой механизм» без урона.
ach.act1.name = Подмастерье
ach.act1.desc = Пройти пятый уровень.
ach.secret_room.name = Рычаг за прилавком
ach.secret_room.desc = Открыть тайник в лавке.
ach.shopper.name = Покупатель
ach.shopper.desc = Купить что-нибудь в лавке.
ach.act2.name = Механик
ach.act2.desc = Пройти десятый уровень.
ach.daredevil.name = Под обстрелом
ach.daredevil.desc = Пройти «Тир», не выключая арбалеты.
ach.life.name = Жизнь идёт
ach.life.desc = Досмотреть тридцать поколений «Жизни».
ach.act3.name = Мастер
ach.act3.desc = Пройти пятнадцатый уровень.
ach.simon.name = Память как сталь
ach.simon.desc = Пройти «Саймона» без единой ошибки.
ach.maze_runner.name = Бегущий в лабиринте
ach.maze_runner.desc = Пройти лабиринт быстрее 30 секунд.
ach.sapper.name = Сапёр
ach.sapper.desc = Перейти минное поле, не наступив ни на одну мину.
ach.heart.name = Сердце остановлено
ach.heart.desc = Победить сердце механизма.
ach.rich.name = Звон монет
ach.rich.desc = Собрать 200 монет за всё время.
ach.untouchable.name = Без единой царапины
ach.untouchable.desc = Пройти пак на обычном уровне без смертей.
ach.hardcore.name = Железный механик
ach.hardcore.desc = Пройти пак на хардкоре.
ach.melted.name = Горячо!
ach.melted.desc = Сгореть в лаве.
ach.bitten.name = Обед для змея
ach.bitten.desc = Попасться змею.
pack.workshop.name = Мастерская механика
pack.workshop.desc = Двадцать комнат-механизмов: плиты, таймеры, стражи, живые стены, «Жизнь» Конвея, Саймон, лабиринт, змей, сапёр и сердце механизма. Пак-пример: всё сделано префабами, текстурами и скриптами DGScript.
