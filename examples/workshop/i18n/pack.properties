# The Mechanist's Workshop (English).
level.01.t1 = The mechanist's workshop.\nEvery room here\nis a mechanism.
level.01.t2 = A chest opens from\nthe next cell.\nThe lamps blink on\ntheir own: a script.
level.01.name = The Workshop
level.02.t1 = A key opens the door\nor chest of its colour.
level.02.name = Keys and locks
level.03.t1 = A button works again\nonly after you step\noff and back on.
level.03.name = Buttons
level.04.t1 = The yellow plate\nbuilds a bridge.
level.04.name = Pressure plates
level.05.t1 = The button opens the gate\nfor nine seconds.\nThe lamps count down.
level.05.name = Clockwork
level.06.t1 = Sentinels walk the rows.\nRest in the middle:\nit heals there.
level.06.name = Patrol
level.07.t1 = A script conducts the fire.\nA green lamp means\nthat column is out.
level.07.name = Fire rhythm
level.08.t1 = It's dark. Follow the firefly,\nit knows the way.\nDead ends hold coins… and traps.
level.08.name = Darkness
level.09.t1 = The shop takes coins.\nAnd the wall on the right\nsounds hollow…
level.09.name = Shop and stash
level.10.t1 = The gaps move every\none and a half seconds.\nA wall never lands on you.
level.10.name = Living walls
level.11.t1 = The bridge builds under you\nand falls behind you.\nDon't stand on the cracks.
level.11.name = Bridge underfoot
level.12.t1 = The teleporter leads where\nthe lit lamp's colour says:\nred, blue, green.
level.12.name = Teleport carousel
level.13.t1 = The crystal opens the exit.\nAnd the cages too.
level.13.name = Kamikaze
level.14.t1 = The lever on the right\ncuts the crossbows' power.\nThe brave go without it.
level.14.name = Shooting gallery
level.15.t1 = Conway's Life on the walls.\nButtons: run/pause, step,\nglider, random.\nAfter 30 generations\nthe exit opens.
level.15.name = Life
level.16.t1 = Remember which lamps\nlit up, and step on\nthe plates in that order.
level.16.name = Simon
level.17.t1 = A script builds the maze,\nnew every time.\nUnder 30 seconds?
level.17.name = Maze
level.18.t1 = Collect three crystals.\nThe snake follows you\nand grows with each.
level.18.name = The snake
level.19.t1 = Twelve mines.\nA number tells how many\nmines are next to it.
level.19.name = Minesweeper
level.20.t1 = Step on the glowing plates:\nthree blows and the heart\nof the machine stops.
level.20.name = Heart of the machine
ach.first_day.name = First day
ach.first_day.desc = Finish the first level.
ach.curious.name = Curious
ach.curious.desc = Find the stash behind the fake wall in “Buttons”.
ach.clockwork.name = Like clockwork
ach.clockwork.desc = Finish “Clockwork” without damage.
ach.act1.name = Apprentice
ach.act1.desc = Finish level 5.
ach.secret_room.name = Behind the counter
ach.secret_room.desc = Open the stash in the shop.
ach.shopper.name = Customer
ach.shopper.desc = Buy anything in the shop.
ach.act2.name = Mechanic
ach.act2.desc = Finish level 10.
ach.daredevil.name = Under fire
ach.daredevil.desc = Finish “Shooting gallery” without switching the crossbows off.
ach.life.name = Life goes on
ach.life.desc = Watch thirty generations of “Life”.
ach.act3.name = Master
ach.act3.desc = Finish level 15.
ach.simon.name = Steel memory
ach.simon.desc = Finish “Simon” without a single mistake.
ach.maze_runner.name = Maze runner
ach.maze_runner.desc = Get through the maze in under 30 seconds.
ach.sapper.name = Sapper
ach.sapper.desc = Cross the minefield without stepping on a mine.
ach.heart.name = Heart stopped
ach.heart.desc = Defeat the heart of the mechanism.
ach.rich.name = Jingle
ach.rich.desc = Collect 200 coins in total.
ach.untouchable.name = Untouchable
ach.untouchable.desc = Finish the pack on normal without dying.
ach.hardcore.name = Iron mechanic
ach.hardcore.desc = Finish the pack on hardcore.
ach.melted.name = Hot!
ach.melted.desc = Burn in lava.
ach.bitten.name = Snake food
ach.bitten.desc = Get caught by the snake.
pack.workshop.name = The Mechanist's Workshop
pack.workshop.desc = Twenty mechanism rooms: plates, timers, sentinels, living walls, Conway's Life, Simon, a maze, a snake, minesweeper and the heart of the machine. An example pack built from prefabs, textures and DGScript.
